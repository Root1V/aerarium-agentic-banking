// Contrato del core bancario de AIBank.
//
// Fuente de verdad de la frontera entre el core (Rust) y los adaptadores (Go).
// Un cambio incompatible aquí rompe la compilación de ambos lados, no la producción.
//
// Reglas del contrato:
//   - El dinero SIEMPRE viaja como entero en micras (millonésimas, 10^-6) + moneda.
//     Nunca punto flotante, nunca decimales en texto.
//   - Toda escritura lleva idempotency_key: los rieles y las redes de tarjetas
//     reintentan, y el efecto debe ocurrir exactamente una vez.
//   - Los errores de negocio viajan con un PostingErrorReason en la metadata
//     `x-aibank-reason`, para que el llamador distinga "fondos insuficientes"
//     (definitivo, no reintentar) de "base no disponible" (reintentable).

syntax = "proto3";

package aibank.core.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aibank/aibank/clients/go/corev1;corev1";

// ---------------------------------------------------------------- tipos base

// Importe monetario en MICRAS: millonésimas (10^-6) de la unidad mayor.
// 1 USD = 1_000_000; 1 centavo = 10_000; $0,001 = 1_000.
//
// La escala es 6 y no 2 porque el banco liquida pagos entre agentes de software,
// donde un precio de $0,001 por llamada es lo normal: en centavos ese importe no
// existe. La app le sigue mostrando dos decimales a una persona — la escala es de
// almacenamiento, no de presentación.
//
// `amount_micros` es siempre positivo en los asientos: el signo lo aporta la
// dirección contable.
message Money {
  int64 amount_micros = 1;
  string currency = 2; // ISO-4217, 3 letras
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_DEBIT = 1;
  DIRECTION_CREDIT = 2;
}

enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_ASSET = 1;
  ACCOUNT_TYPE_LIABILITY = 2;
  ACCOUNT_TYPE_EQUITY = 3;
  ACCOUNT_TYPE_INCOME = 4;
  ACCOUNT_TYPE_EXPENSE = 5;
}

enum AccountOwner {
  ACCOUNT_OWNER_UNSPECIFIED = 0;
  ACCOUNT_OWNER_CUSTOMER = 1;
  ACCOUNT_OWNER_INTERNAL = 2;
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_ACTIVE = 1;
  ACCOUNT_STATUS_FROZEN = 2;
  ACCOUNT_STATUS_CLOSED = 3;
}

// Motivo de un rechazo. Viaja en la metadata `x-aibank-reason` junto al código gRPC.
enum PostingErrorReason {
  POSTING_ERROR_REASON_UNSPECIFIED = 0;
  // La solicitud viola una regla del ledger (desbalance, monto <= 0, moneda).
  POSTING_ERROR_REASON_INVALID = 1;
  // La clave de idempotencia ya se usó con un payload distinto.
  POSTING_ERROR_REASON_IDEMPOTENCY_CONFLICT = 2;
  // La cuenta quedaría en negativo y el producto no admite sobregiro.
  POSTING_ERROR_REASON_INSUFFICIENT_FUNDS = 3;
  // El saldo superaría el tope regulatorio del producto.
  POSTING_ERROR_REASON_BALANCE_CAP_EXCEEDED = 4;
  // El monto supera el tope por operación del producto.
  POSTING_ERROR_REASON_TRANSACTION_CAP_EXCEEDED = 5;
  // Ya existe un registro con esa clave (código de cuenta o de producto repetido).
  POSTING_ERROR_REASON_ALREADY_EXISTS = 6;
}

// ---------------------------------------------------------------- ledger

message Entry {
  string account_id = 1; // UUID
  Direction direction = 2;
  Money amount = 3;
}

message PostRequest {
  // Definida por quien origina la operación. Garantiza efecto único.
  string idempotency_key = 1;
  // Naturaleza del movimiento: "deposit", "withdrawal", "p2p_transfer", ...
  string kind = 2;
  // Dos o más asientos que deben balancear por moneda.
  repeated Entry entries = 3;
  string description = 4;
}

message PostResponse {
  string transaction_id = 1;
  google.protobuf.Timestamp posted_at = 2;
  // true si la clave ya existía: se devolvió la transacción original sin duplicar.
  bool replayed = 3;
}

message GetBalanceRequest {
  string account_id = 1;
}

message GetBalanceResponse {
  Money balance = 1;
  int64 entry_count = 2;
  // Saldo recalculado desde los asientos. Debe coincidir con `balance`;
  // una discrepancia es un incidente contable.
  Money projected_balance = 3;
}

// Movimiento tal como se muestra en un extracto.
message AccountEntry {
  // Identidad estable para paginar. Opaca para el cliente.
  string cursor = 1;
  string transaction_id = 2;
  Direction direction = 3;
  Money amount = 4;
  // "deposit", "p2p_transfer", "rail_inbound_credit", ...
  string kind = 5;
  string description = 6;
  google.protobuf.Timestamp posted_at = 7;
}

message ListEntriesRequest {
  string account_id = 1;
  // Máximo de movimientos a devolver. 0 = valor por defecto del servidor.
  int32 limit = 2;
  // Cursor de la página anterior; vacío para empezar por el movimiento más reciente.
  string cursor = 3;
}

message ListEntriesResponse {
  // Del más reciente al más antiguo.
  repeated AccountEntry entries = 1;
  // Vacío cuando no hay más páginas.
  string next_cursor = 2;
}

service LedgerService {
  // Única vía de escritura al ledger. Idempotente por `idempotency_key`.
  rpc Post(PostRequest) returns (PostResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  // Extracto de una cuenta, del movimiento más reciente al más antiguo.
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse);
}

// ---------------------------------------------------------------- cuentas

message Account {
  string id = 1;
  string code = 2;
  string name = 3;
  AccountType type = 4;
  AccountOwner owner = 5;
  string owner_id = 6;   // vacío en cuentas internas
  string product_id = 7; // vacío en cuentas internas
  string currency = 8;
  AccountStatus status = 9;
  bool allows_overdraft = 10;
  google.protobuf.Timestamp created_at = 11;
}

message OpenCustomerAccountRequest {
  string code = 1;
  string name = 2;
  string customer_id = 3;
  // Producto del catálogo del que la cuenta hereda moneda y reglas.
  string product_code = 4;
}

message CreateInternalAccountRequest {
  string code = 1;
  string name = 2;
  AccountType type = 3;
  string currency = 4;
}

message GetAccountRequest {
  string code = 1;
}

message GetAccountByIdRequest {
  string id = 1;
}

service AccountService {
  rpc OpenCustomerAccount(OpenCustomerAccountRequest) returns (Account);
  rpc CreateInternalAccount(CreateInternalAccountRequest) returns (Account);
  rpc GetAccount(GetAccountRequest) returns (Account);
  rpc GetAccountById(GetAccountByIdRequest) returns (Account);
}

// ---------------------------------------------------------------- productos

message Product {
  string id = 1;
  string code = 2;
  string name = 3;
  string currency = 4;
  bool allows_overdraft = 5;
  // Topes regulatorios; ausentes = sin tope.
  optional int64 max_balance_micros = 6;
  optional int64 max_transaction_micros = 7;
  bool active = 8;
}

message CreateProductRequest {
  string code = 1;
  string name = 2;
  string currency = 3;
  bool allows_overdraft = 4;
  optional int64 max_balance_micros = 5;
  optional int64 max_transaction_micros = 6;
}

message GetProductRequest {
  string code = 1;
}

service ProductService {
  rpc CreateProduct(CreateProductRequest) returns (Product);
  rpc GetProduct(GetProductRequest) returns (Product);
}

// ---------------------------------------------------------------- conciliación

enum FindingKind {
  FINDING_KIND_UNSPECIFIED = 0;
  // El saldo materializado no coincide con la suma de los asientos.
  FINDING_KIND_BALANCE_DRIFT = 1;
  // El proveedor reporta un movimiento que no está en el ledger.
  FINDING_KIND_MISSING_IN_LEDGER = 2;
  // El ledger registra un movimiento que el proveedor no reporta.
  FINDING_KIND_MISSING_AT_PROVIDER = 3;
  // Ambos lo tienen, por importes distintos.
  FINDING_KIND_AMOUNT_MISMATCH = 4;
  // Dinero detenido en tránsito o retención más allá del plazo razonable.
  FINDING_KIND_STALE_SUSPENSE = 5;
}

message Finding {
  int64 id = 1;
  string run_id = 2;
  FindingKind kind = 3;
  string account_id = 4;
  string reference = 5;
  // Lo que debería ser y lo que hay, en micras.
  int64 expected_micros = 6;
  int64 actual_micros = 7;
  string currency = 8;
  string detail = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ListOpenFindingsRequest {
  int32 limit = 1;
}

message ListOpenFindingsResponse {
  repeated Finding findings = 1;
}

message ResolveFindingRequest {
  int64 finding_id = 1;
  // Cómo se resolvió. Queda registrado: una diferencia cerrada sin explicación
  // no sirve ante una auditoría.
  string resolution = 2;
}

message ResolveFindingResponse {
  bool resolved = 1;
}

message RunInternalCheckRequest {}

message RunInternalCheckResponse {
  string run_id = 1;
  int32 findings_count = 2;
}

service ReconciliationService {
  // Diferencias abiertas, para la cola de operaciones.
  rpc ListOpenFindings(ListOpenFindingsRequest) returns (ListOpenFindingsResponse);
  // Cierra una diferencia dejando constancia.
  rpc ResolveFinding(ResolveFindingRequest) returns (ResolveFindingResponse);
  // Dispara la conciliación interna bajo demanda.
  rpc RunInternalCheck(RunInternalCheckRequest) returns (RunInternalCheckResponse);
}

// ---------------------------------------------------------------- autorizaciones

// Estado de una autorización tal como se le reporta a quien consulta.
//
// `EXPIRED` no es un estado almacenado sino uno derivado: es lo que significa una
// retención viva cuya fecha ya pasó. Guardarlo obligaría a escribir en la base
// cada vez que el reloj avanza.
enum AuthorizationStatus {
  AUTHORIZATION_STATUS_UNSPECIFIED = 0;
  // Dinero retenido, todavía no entregado al receptor.
  AUTHORIZATION_STATUS_AUTHORIZED = 1;
  // Liquidada: el dinero está en la cuenta del receptor.
  AUTHORIZATION_STATUS_CAPTURED = 2;
  AUTHORIZATION_STATUS_PARTIALLY_REFUNDED = 3;
  AUTHORIZATION_STATUS_REFUNDED = 4;
  // La retención se devolvió al pagador sin cobrar.
  AUTHORIZATION_STATUS_RELEASED = 5;
  // Vigencia terminada y todavía sin barrer. No se puede capturar.
  AUTHORIZATION_STATUS_EXPIRED = 6;
}

// Motivo de un rechazo sobre una autorización. Viaja en `x-aibank-reason`.
enum AuthorizationErrorReason {
  AUTHORIZATION_ERROR_REASON_UNSPECIFIED = 0;
  AUTHORIZATION_ERROR_REASON_INVALID = 1;
  AUTHORIZATION_ERROR_REASON_IDEMPOTENCY_CONFLICT = 2;
  AUTHORIZATION_ERROR_REASON_NOT_FOUND = 3;
  AUTHORIZATION_ERROR_REASON_ACCOUNT_NOT_FOUND = 4;
  // La cuenta existe pero está congelada o cerrada.
  AUTHORIZATION_ERROR_REASON_ACCOUNT_NOT_OPERATIVE = 5;
  AUTHORIZATION_ERROR_REASON_EXPIRED = 6;
  // La operación no aplica al estado actual (reembolsar sin capturar, por ejemplo).
  AUTHORIZATION_ERROR_REASON_INVALID_STATE = 7;
  AUTHORIZATION_ERROR_REASON_INSUFFICIENT_FUNDS = 8;
  AUTHORIZATION_ERROR_REASON_CURRENCY_MISMATCH = 9;
}

message Authorization {
  string id = 1;
  string idempotency_key = 2;
  string payer_account_id = 3;
  string payee_account_id = 4;
  Money amount = 5;
  AuthorizationStatus status = 6;
  // Cuánto se devolvió ya. Cero mientras no haya reembolso.
  int64 refunded_micros = 7;
  google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp created_at = 9;
  // Presente solo si se capturó.
  optional google.protobuf.Timestamp settled_at = 10;
  optional google.protobuf.Timestamp released_at = 11;
}

message AuthorizeRequest {
  string idempotency_key = 1;
  string payer_account_id = 2;
  string payee_account_id = 3;
  Money amount = 4;
  // Vigencia. 0 = valor por defecto del servidor (15 minutos).
  int32 ttl_minutes = 5;
}

message AuthorizeResponse {
  Authorization authorization = 1;
  // true si la clave ya existía y se devolvió la autorización original.
  bool replayed = 2;
}

message CaptureRequest {
  string authorization_id = 1;
}

message RefundRequest {
  string authorization_id = 1;
  // 0 = reembolso total de lo que quede sin devolver.
  int64 amount_micros = 2;
}

message GetAuthorizationRequest {
  string authorization_id = 1;
}

message ReleaseExpiredRequest {
  // Máximo de autorizaciones a liberar en esta pasada. 0 = valor por defecto.
  int32 limit = 1;
}

message ReleaseExpiredResponse {
  repeated string authorization_ids = 1;
}

service AuthorizationService {
  // Retiene el monto en la cuenta pagadora. Idempotente por `idempotency_key`.
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
  // Liquida la retención al receptor. Idempotente por naturaleza: capturar dos
  // veces devuelve la misma captura, con el mismo `settled_at`.
  rpc Capture(CaptureRequest) returns (Authorization);
  // Devuelve dinero ya capturado al pagador.
  rpc Refund(RefundRequest) returns (Authorization);
  rpc GetAuthorization(GetAuthorizationRequest) returns (Authorization);
  // Libera las retenciones vencidas. La invoca un proceso periódico.
  rpc ReleaseExpired(ReleaseExpiredRequest) returns (ReleaseExpiredResponse);
}

// ---------------------------------------------------------------- mandatos

// Estado observable de un mandato. `EXPIRED` se deriva del reloj, igual que en
// las autorizaciones: no se almacena.
enum MandateStatus {
  MANDATE_STATUS_UNSPECIFIED = 0;
  MANDATE_STATUS_ACTIVE = 1;
  // El titular retiró el permiso.
  MANDATE_STATUS_REVOKED = 2;
  MANDATE_STATUS_EXPIRED = 3;
}

enum MandateErrorReason {
  MANDATE_ERROR_REASON_UNSPECIFIED = 0;
  MANDATE_ERROR_REASON_INVALID = 1;
  MANDATE_ERROR_REASON_NOT_FOUND = 2;
  MANDATE_ERROR_REASON_REVOKED = 3;
  MANDATE_ERROR_REASON_EXPIRED = 4;
  // El pago cabe en el saldo pero no en lo que el titular autorizó.
  MANDATE_ERROR_REASON_LIMIT_EXCEEDED = 5;
  // El mandato no habilita esa cuenta como pagadora.
  MANDATE_ERROR_REASON_ACCOUNT_NOT_COVERED = 6;
}

message Mandate {
  string id = 1;
  string account_id = 2;
  // client_id de la integración autorizada.
  string grantee = 3;
  // Titular que otorgó el permiso.
  string granted_by = 4;
  string currency = 5;
  // Topes; ausentes = sin tope por esa dimensión.
  optional int64 max_per_operation_micros = 6;
  optional int64 max_total_micros = 7;
  // Comprometido hasta ahora. Derivado de las autorizaciones, no de un contador.
  int64 consumed_micros = 8;
  MandateStatus status = 9;
  google.protobuf.Timestamp expires_at = 10;
  google.protobuf.Timestamp created_at = 11;
  optional google.protobuf.Timestamp revoked_at = 12;
}

message GrantMandateRequest {
  string account_id = 1;
  string grantee = 2;
  // Titular que se autenticó. Debe ser el dueño de la cuenta.
  string granted_by = 3;
  // Evidencia del flujo de consentimiento. Obligatoria: un mandato sin ella no
  // prueba nada, y probar es lo único que justifica su existencia.
  string consent_reference = 4;
  optional int64 max_per_operation_micros = 5;
  optional int64 max_total_micros = 6;
  google.protobuf.Timestamp expires_at = 7;
}

message RevokeMandateRequest {
  string mandate_id = 1;
  // Quién revoca: el titular, operaciones o la propia integración.
  string revoked_by = 2;
}

message GetMandateRequest {
  string mandate_id = 1;
}

message FindActiveMandateRequest {
  string account_id = 1;
  string grantee = 2;
}

message ListMandatesRequest {
  // Titular cuyos mandatos se listan.
  string granted_by = 1;
}

message ListMandatesResponse {
  repeated Mandate mandates = 1;
}

// Autoriza un pago bajo un mandato. Mismo contrato que Authorize, más el
// mandato que lo habilita.
message AuthorizeUnderMandateRequest {
  string mandate_id = 1;
  AuthorizeRequest authorization = 2;
}

message AuthorizeUnderMandateResponse {
  Authorization authorization = 1;
  bool replayed = 2;
  Mandate mandate = 3;
}

service MandateService {
  // Registra el permiso que un titular otorgó tras autenticarse.
  rpc GrantMandate(GrantMandateRequest) returns (Mandate);
  // Retira el permiso. Idempotente. No cancela las retenciones ya vivas.
  rpc RevokeMandate(RevokeMandateRequest) returns (Mandate);
  rpc GetMandate(GetMandateRequest) returns (Mandate);
  // Permiso vivo de una integración sobre una cuenta. NOT_FOUND si no hay.
  rpc FindActiveMandate(FindActiveMandateRequest) returns (Mandate);
  // Mandatos de un titular, para que los vea y los revoque en su app.
  rpc ListMandates(ListMandatesRequest) returns (ListMandatesResponse);
  // Inicia un pago bajo un mandato: comprueba el permiso y retiene en la misma
  // transacción.
  rpc AuthorizeUnderMandate(AuthorizeUnderMandateRequest) returns (AuthorizeUnderMandateResponse);
}
