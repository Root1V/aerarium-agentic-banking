# Entorno local de desarrollo AIBank
# Uso: docker compose -f platform/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: aibank-postgres
    environment:
      POSTGRES_USER: aibank
      POSTGRES_PASSWORD: aibank_dev
      POSTGRES_DB: aibank
    ports:
      - "5434:5432"   # 5434 en el host para no chocar con un Postgres local
    volumes:
      - aibank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibank"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redpanda: compatible con la API de Kafka en un solo binario, sin ZooKeeper.
  # Para desarrollo local pesa mucho menos que un clúster Kafka completo.
  redpanda:
    image: redpandadata/redpanda:v24.3.1
    container_name: aibank-redpanda
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --check=false
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  aibank_pgdata:
